name: Deploy PWA to GitHub Pages

# Pubblica la PWA (mobile/pwa-shell) su GitHub Pages.
# Sorgente Pages = "GitHub Actions". Se il primo run fallisce con "Pages not enabled",
# vai su Settings → Pages → Source: "GitHub Actions" una sola volta e ri-lancia.

on:
  push:
    branches: [claude/fable-notification-interruptions-86mzb6]
    paths:
      - "mobile/pwa-shell/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annullare un deploy in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact (PWA shell as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/pwa-shell

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
