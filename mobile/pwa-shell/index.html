<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="manifest" href="public/manifest.json" />
    <link rel="apple-touch-icon" href="public/icons/icon-192.png" />
    <title>◌ flow</title>
    <style>
      :root { --bg:#0b0d12; --bg2:#151823; --ink:#f3f5fb; --dim:#9aa3b8; --line:#2a3040; --glass:rgba(255,255,255,.06); --accent:#a9c6ff; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: system-ui, "Segoe UI", "Noto Sans", "Noto Sans Arabic", "Noto Sans SC", "Noto Sans Devanagari", Roboto, sans-serif;
        background: radial-gradient(120% 70% at 50% 0%, #18203400 0%, var(--bg) 70%), var(--bg);
        color: var(--ink); display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      }
      button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }

      .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
      .top .sp { flex: 1; }
      .pill { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim);
        border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
      .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #57e389; box-shadow: 0 0 8px #57e389; }
      .ic { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px;
        background: var(--glass); border: 1px solid var(--line); }
      .ic:active { background: rgba(255,255,255,.16); }

      /* STEPS — solid, high-contrast chips (always visible) */
      .stepswrap { padding: 4px 8px 2px; }
      .hint { text-align: center; font-size: 12px; color: var(--dim); margin: 0 0 8px; }
      .steps { display: flex; gap: 14px; overflow-x: auto; padding: 6px 12px 14px; justify-content: center; scrollbar-width: none; }
      .steps::-webkit-scrollbar { display: none; }
      .chip { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 70px; opacity: .38; transition: opacity .2s, transform .2s; }
      .chip.on { opacity: 1; }
      .chip.run { transform: translateY(-4px) scale(1.06); }
      .disc { width: 58px; height: 58px; border-radius: 50%; background: var(--c); display: grid; place-items: center;
        box-shadow: 0 0 0 2px rgba(255,255,255,.08); }
      .chip.on .disc { box-shadow: 0 0 22px -2px var(--c), 0 0 0 2px rgba(255,255,255,.25); }
      .chip.run .disc { animation: bump .6s infinite; }
      @keyframes bump { 50% { box-shadow: 0 0 34px 2px var(--c), 0 0 0 3px #fff; } }
      .disc svg { width: 30px; height: 30px; color: #0b0d12; }
      .chip .nm { font-size: 12px; color: var(--ink); text-align: center; line-height: 1.2; }
      .chip .num { position: absolute; }

      /* MIDDLE — answer */
      .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 4px 18px; }
      .out { flex: 1; min-height: 0; overflow-y: auto; font-size: 19px; line-height: 1.55; padding: 10px 0; white-space: pre-wrap; }
      .out:empty::before { content: attr(data-empty); color: var(--dim); font-size: 15px; }
      .status { text-align: center; font-size: 12px; color: var(--accent); min-height: 16px; padding-bottom: 6px; }

      /* BOTTOM — input + play */
      .composer { display: flex; gap: 10px; align-items: center; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line); background: var(--bg2); }
      .composer textarea { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); resize: none;
        background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 13px 16px; max-height: 120px; }
      .play { width: 56px; height: 56px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center;
        background: linear-gradient(180deg, #e9f1ff, #a9c6ff); color: #0b0d12; box-shadow: 0 4px 18px rgba(169,198,255,.4); }
      .play:disabled { filter: grayscale(.5) brightness(.85); }
      .play svg { width: 24px; height: 24px; }

      /* sheets */
      .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 9; display: none; }
      .scrim.open { display: block; }
      .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; transform: translateY(100%); transition: transform .25s;
        background: var(--bg2); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 16px;
        padding-bottom: calc(20px + env(safe-area-inset-bottom)); max-height: 80dvh; overflow-y: auto; }
      .sheet.open { transform: translateY(0); }
      .sheet h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin: 2px 0 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap: 10px; }
      .lang { border: 1px solid var(--line); border-radius: 12px; padding: 14px 8px; background: var(--glass); text-align: center; font-size: 15px; color: var(--ink); }
      .lang.on { border-color: var(--accent); }
      select { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 10px; padding: 11px; }
      select option { background: #151823; }
      .btn { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 13px; background: var(--glass); margin-top: 12px; }
      .btn.primary { background: linear-gradient(180deg, #e9f1ff, #a9c6ff); color: #0b0d12; border: none; font-weight: 600; }
      .muted { font-size: 12px; color: var(--dim); margin-top: 12px; line-height: 1.55; text-align: center; }
    </style>
  </head>
  <body>
    <div class="top">
      <button class="ic" id="btnLang" aria-label="language">🌐</button>
      <span class="sp"></span>
      <span class="pill"><span class="dot"></span><span id="pillTxt"></span></span>
      <span class="sp"></span>
      <button class="ic" id="btnModel" aria-label="engine">⚡</button>
    </div>

    <div class="stepswrap">
      <div class="hint" id="hint"></div>
      <div class="steps" id="steps"></div>
    </div>

    <div class="stage">
      <div class="status" id="status"></div>
      <div class="out" id="out"></div>
    </div>

    <div class="composer">
      <textarea id="signal" rows="1"></textarea>
      <button class="play" id="run" aria-label="run"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheetLang"><h3 id="t_language"></h3><div class="grid" id="langGrid"></div></div>
    <div class="sheet" id="sheetModel">
      <h3 id="t_model"></h3>
      <select id="model"><option>—</option></select>
      <button class="btn" id="showAll"></button>
      <button class="btn primary" id="load"></button>
      <div class="muted" id="prog2"></div>
      <div class="muted" id="t_note"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // universal geometric pictograms (dark glyph on bright disc)
      const ICON = {
        expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5"/><path d="M12 7V3M12 17v4M7 12H3M17 12h4"/></svg>',
        compress: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2.5"/><path d="M5 5l3 3M19 5l-3 3M5 19l3-3M19 19l-3-3"/></svg>',
        translate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
        distill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>',
        refine: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg>',
      };

      const MODS = {
        expand:   { icon:"expand",   c:"#7ad1ff", nm:{ en:"Expand", es:"Ampliar", ar:"توسيع", zh:"扩展", hi:"विस्तार", sw:"Panua", ru:"Шире", fr:"Élargir" },
          system:"Expand and enrich the user's text with useful detail, same language. Output only the text.",
          demo:(s)=> s + " — " + s.toLowerCase() },
        compress: { icon:"compress", c:"#9ae6b4", nm:{ en:"Shorten", es:"Acortar", ar:"اختصار", zh:"精简", hi:"संक्षेप", sw:"Fupisha", ru:"Короче", fr:"Abréger" },
          system:"Summarize the user's text in one essential sentence, same language. Only the summary.",
          demo:(s)=> s.split(/\s+/).slice(0,8).join(" ") + "…" },
        translate:{ icon:"translate", c:"#ffd166", nm:{ en:"Translate", es:"Traducir", ar:"ترجمة", zh:"翻译", hi:"अनुवाद", sw:"Tafsiri", ru:"Перевод", fr:"Traduire" },
          system:"Translate the user's text to English. Output only the translation.",
          demo:(s)=> "→ " + s },
        distill:  { icon:"distill",  c:"#c4b5fd", nm:{ en:"Key points", es:"Claves", ar:"النقاط", zh:"要点", hi:"मुख्य", sw:"Vidokezo", ru:"Тезисы", fr:"Points clés" },
          system:"Extract the key points as a very short bullet list, same language. Only the list.",
          demo:(s)=> "• " + s.split(/\s+/).filter((w)=>w.length>4).slice(0,5).join("\n• ") },
        refine:   { icon:"refine",   c:"#ffd9a0", nm:{ en:"Polish", es:"Pulir", ar:"تحسين", zh:"润色", hi:"सुधार", sw:"Boresha", ru:"Чище", fr:"Affiner" },
          system:"Rewrite the text clearly and smoothly, same language. Only the text.",
          demo:(s)=> { s=s.trim(); return s.charAt(0).toUpperCase()+s.slice(1)+(/[.!?]$/.test(s)?"":"."); } },
      };

      const UI = {
        en:{ name:"English", bcp:"en-US", ph:"Write your message…", empty:"the answer appears here", hint:"tap the steps · type · press ▶",
          language:"Language", model:"Engine", showAll:"Show all engines", power:"Power the engine", ondevice:"on your device",
          ready:"ready", demo:"demo", note:"Needs WebGPU. The lightest engine runs on any phone. Downloads once, then offline." },
        es:{ name:"Español", bcp:"es-ES", ph:"Escribe tu mensaje…", empty:"la respuesta aparece aquí", hint:"toca los pasos · escribe · pulsa ▶",
          language:"Idioma", model:"Motor", showAll:"Ver todos los motores", power:"Encender el motor", ondevice:"en tu dispositivo",
          ready:"listo", demo:"demo", note:"Requiere WebGPU. El motor más ligero funciona en cualquier móvil. Se descarga una vez y luego sin conexión." },
        ar:{ name:"العربية", bcp:"ar-SA", rtl:true, ph:"اكتب رسالتك…", empty:"تظهر الإجابة هنا", hint:"المس الخطوات · اكتب · اضغط ▶",
          language:"اللغة", model:"المحرك", showAll:"كل المحركات", power:"تشغيل المحرك", ondevice:"على جهازك",
          ready:"جاهز", demo:"عرض", note:"يتطلب WebGPU. أخف محرك يعمل على أي هاتف. يُحمَّل مرة واحدة ثم دون اتصال." },
        zh:{ name:"中文", bcp:"zh-CN", ph:"写下你的消息…", empty:"答案出现在这里", hint:"点选步骤 · 输入 · 按 ▶",
          language:"语言", model:"引擎", showAll:"显示全部引擎", power:"启动引擎", ondevice:"在你的设备上",
          ready:"就绪", demo:"演示", note:"需要 WebGPU。最轻引擎可在任何手机运行。仅下载一次，之后离线。" },
        hi:{ name:"हिन्दी", bcp:"hi-IN", ph:"अपना संदेश लिखें…", empty:"उत्तर यहाँ दिखेगा", hint:"चरण चुनें · लिखें · ▶ दबाएँ",
          language:"भाषा", model:"इंजन", showAll:"सभी इंजन", power:"इंजन चालू करें", ondevice:"आपके डिवाइस पर",
          ready:"तैयार", demo:"डेमो", note:"WebGPU चाहिए। सबसे हल्का इंजन किसी भी फ़ोन पर चलता है। एक बार डाउनलोड, फिर ऑफ़लाइन।" },
        sw:{ name:"Kiswahili", bcp:"sw-KE", ph:"Andika ujumbe wako…", empty:"jibu litaonekana hapa", hint:"gusa hatua · andika · bonyeza ▶",
          language:"Lugha", model:"Injini", showAll:"Onyesha injini zote", power:"Washa injini", ondevice:"kwenye kifaa chako",
          ready:"tayari", demo:"onyesho", note:"Inahitaji WebGPU. Injini nyepesi hufanya kazi kwenye simu yoyote. Hupakuliwa mara moja, kisha nje ya mtandao." },
        ru:{ name:"Русский", bcp:"ru-RU", ph:"Напишите сообщение…", empty:"ответ появится здесь", hint:"выберите шаги · напишите · нажмите ▶",
          language:"Язык", model:"Движок", showAll:"Все движки", power:"Запустить движок", ondevice:"на вашем устройстве",
          ready:"готово", demo:"демо", note:"Нужен WebGPU. Самый лёгкий движок работает на любом телефоне. Загрузка один раз, потом офлайн." },
        fr:{ name:"Français", bcp:"fr-FR", ph:"Écrivez votre message…", empty:"la réponse apparaît ici", hint:"touchez les étapes · écrivez · appuyez ▶",
          language:"Langue", model:"Moteur", showAll:"Tous les moteurs", power:"Démarrer le moteur", ondevice:"sur votre appareil",
          ready:"prêt", demo:"démo", note:"Nécessite WebGPU. Le moteur le plus léger fonctionne sur tout téléphone. Téléchargé une fois, puis hors ligne." },
      };
      let lang = localStorage.getItem("vulcano.lang") || (navigator.language || "en").slice(0,2);
      if (!UI[lang]) lang = "en";
      const L = () => UI[lang];
      const modName = (id) => MODS[id].nm[lang] || MODS[id].nm.en;

      // active steps (the pipeline), in fixed left→right order
      const ORDER = Object.keys(MODS);
      let active = JSON.parse(localStorage.getItem("vulcano.steps") || "null") || ["expand","compress","refine"];
      const saveSteps = () => localStorage.setItem("vulcano.steps", JSON.stringify(active));

      function renderSteps() {
        const host = $("steps"); host.innerHTML = "";
        ORDER.forEach((id) => {
          const mod = MODS[id];
          const chip = document.createElement("button");
          chip.className = "chip" + (active.includes(id) ? " on" : "");
          chip.dataset.id = id;
          chip.innerHTML = `<div class="disc" style="--c:${mod.c}">${ICON[mod.icon]}</div><div class="nm">${modName(id)}</div>`;
          chip.onclick = () => {
            if (active.includes(id)) active = active.filter((x) => x !== id);
            else active = ORDER.filter((x) => active.includes(x) || x === id); // keep canonical order
            saveSteps(); renderSteps();
          };
          host.appendChild(chip);
        });
      }

      function applyLang() {
        document.documentElement.lang = lang;
        document.documentElement.dir = L().rtl ? "rtl" : "ltr";
        $("signal").placeholder = L().ph;
        $("out").dataset.empty = L().empty;
        $("hint").textContent = L().hint;
        $("pillTxt").textContent = (modelOn ? L().ready : L().demo) + " · " + L().ondevice;
        $("t_language").textContent = L().language;
        $("t_model").textContent = L().model;
        $("t_note").textContent = L().note;
        $("showAll").textContent = L().showAll;
        $("load").textContent = L().power;
        localStorage.setItem("vulcano.lang", lang);
        renderSteps();
      }

      // ---------- model (WebLLM lazy) ----------
      let webllm = null, listed = false, modelOn = false, showAll = false, mode = "demo";
      let engine = null, loadedModel = null;
      async function importWebLLM() { if (!webllm) webllm = await import("https://esm.run/@mlc-ai/web-llm"); return webllm; }
      async function listModels() {
        const sel = $("model");
        try {
          const w = await importWebLLM();
          const list = w.prebuiltAppConfig.model_list.filter((m) => showAll || m.low_resource_required)
            .sort((a, b) => (a.vram_required_MB || 1e9) - (b.vram_required_MB || 1e9));
          sel.innerHTML = "";
          for (const m of list) { const o = document.createElement("option");
            const gb = m.vram_required_MB ? ` · ~${(m.vram_required_MB / 1024).toFixed(1)} GB` : "";
            o.value = m.model_id; o.textContent = m.model_id + gb; sel.appendChild(o); }
          const def = list.find((m) => /Qwen2\.5-1\.5B|Llama-3\.2-1B/.test(m.model_id)) || list[0];
          if (def) sel.value = def.model_id; listed = true;
        } catch { sel.innerHTML = "<option>—</option>"; }
      }
      async function ensureModel() {
        if (!listed) await listModels();
        const id = $("model").value; if (!id || id === "—") throw new Error("model");
        if (engine && loadedModel === id) return engine;
        const w = await importWebLLM();
        const cb = (r) => { $("prog2").textContent = `${(r.progress || 0) * 100 | 0}% · ${r.text}`; $("status").textContent = `${(r.progress || 0) * 100 | 0}%`; };
        if (!engine) engine = await w.CreateMLCEngine(id, { initProgressCallback: cb });
        else await engine.reload(id);
        loadedModel = id; modelOn = true; mode = "local"; applyLang();
        $("prog2").textContent = L().ready + " · " + id;
        return engine;
      }
      async function processStep(id, input) {
        const mod = MODS[id];
        if (mode === "local") {
          const eng = await ensureModel();
          const r = await eng.chat.completions.create({
            messages: [{ role: "system", content: mod.system }, { role: "user", content: input }], temperature: 0.6 });
          return (r.choices?.[0]?.message?.content || "").trim();
        }
        await sleep(420); return String(mod.demo(input));
      }

      // ---------- run ----------
      let busy = false;
      const isRTL = (s) => /[֐-׿؀-ۿ]/.test((s || "").trim()[0] || "");
      async function run() {
        if (busy) return;
        const input = $("signal").value.trim();
        if (!input) { $("signal").focus(); return; }
        const steps = ORDER.filter((id) => active.includes(id));
        if (!steps.length) { $("status").textContent = "•••"; return; }
        busy = true; $("run").disabled = true; $("out").textContent = "";
        let sig = input;
        for (const id of steps) {
          const chip = $("steps").querySelector(`[data-id="${id}"]`);
          chip && chip.classList.add("run");
          $("status").textContent = modName(id) + " …";
          try { sig = await processStep(id, sig); }
          catch (e) { $("status").textContent = "⚠ " + (e?.message || e); chip && chip.classList.remove("run"); busy = false; $("run").disabled = false; return; }
          chip && chip.classList.remove("run");
          $("out").textContent = sig; $("out").dir = isRTL(sig) ? "rtl" : "ltr";
        }
        $("status").textContent = "✓";
        busy = false; $("run").disabled = false;
      }

      // ---------- sheets ----------
      const sheets = ["sheetLang", "sheetModel"];
      function closeSheets() { sheets.forEach((s) => $(s).classList.remove("open")); $("scrim").classList.remove("open"); }
      function openSheet(id) { closeSheets(); $(id).classList.add("open"); $("scrim").classList.add("open"); }
      function renderLangs() {
        const g = $("langGrid"); g.innerHTML = "";
        for (const code of Object.keys(UI)) {
          const b = document.createElement("button"); b.className = "lang" + (code === lang ? " on" : "");
          b.textContent = UI[code].name;
          b.onclick = () => { lang = code; applyLang(); closeSheets(); };
          g.appendChild(b);
        }
      }
      $("scrim").onclick = closeSheets;
      $("btnLang").onclick = () => { renderLangs(); openSheet("sheetLang"); };
      $("btnModel").onclick = async () => { openSheet("sheetModel"); if (!listed) await listModels(); };
      $("load").onclick = () => ensureModel().catch((e) => { $("prog2").textContent = "⚠ " + (e?.message || e); });
      $("showAll").onclick = async () => { showAll = !showAll; listed = false; await listModels(); };
      $("run").onclick = run;
      $("signal").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(); } });
      $("signal").addEventListener("input", (e) => { const t = e.target; t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; t.dir = isRTL(t.value) ? "rtl" : "ltr"; });

      // ---------- init ----------
      applyLang();
      if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
        addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    </script>
  </body>
</html>
